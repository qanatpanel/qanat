<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo"></div>
      <div>
        <h1 data-i18n="title">قنات</h1>
        <span class="qanat-tag">QANAT</span>
        <span class="ver">v__VERSION__</span>
      </div>
    </div>
    <p class="sub" data-i18n="subtitle">برای دسترسی به پنل، رمز عبور را وارد کنید</p>

    <form id="login-form" novalidate>
      <label for="password" data-i18n="passwordLabel">رمز عبور</label>
      <div class="pass-row">
        <input id="password" type="password" required autocomplete="current-password" data-i18n-ph="passwordPh" placeholder="رمز عبور"/>
        <button type="button" id="toggle-pass" class="icon-btn" aria-label="show">👁️</button>
      </div>
      <div id="error" class="error"></div>
      <button type="submit" id="submit" class="btn-primary" data-i18n="enter">ورود به پنل</button>
    </form>

    <div class="foot">
      <span class="copy">v__VERSION__</span>
      <div style="display:flex;gap:8px">
        <button id="lang-btn" class="ghost-btn">English</button>
        <button id="theme-btn" class="ghost-btn">🌙</button>
      </div>
    </div>
  </div>
</main>
<script>/* JS_PLACEHOLDER */</script>
